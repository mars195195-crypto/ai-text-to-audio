name: Build Android APK V0.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find V0.5 ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*V0.5*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 找不到 V0.5 ZIP"
            exit 1
          fi

          echo "找到：$ZIP_FILE"
          echo "zipfile=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V0.5 project
        shell: bash
        run: |
          rm -rf v05-project
          mkdir -p v05-project

          unzip -q "${{ steps.findzip.outputs.zipfile }}" -d v05-project

          echo "===== V0.5 project files ====="
          find v05-project -maxdepth 5 -type f | sort

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find v05-project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: 找不到 settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "project=$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK_FILE=$(find v05-project -type f -path "*/app/build/outputs/apk/debug/app-debug.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: 找不到 APK"
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK_FILE" \
            "apk-output/AI文字轉新音檔-V0.5-免費測試版.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI文字轉新音檔-V0.5-APK
          path: apk-output/AI文字轉新音檔-V0.5-免費測試版.apk
          if-no-files-found: error
          retention-days: 30
