name: Build Android APK V0.17

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find V0.17 ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE="./AI文字轉新音檔-V0.17-台灣聲音專用版-再檢查修正版.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: 找不到指定的 V0.17 修正版 ZIP"
            echo "預期檔名：$ZIP_FILE"
            find . -maxdepth 1 -type f -print
            exit 1
          fi
          echo "找到 ZIP：$ZIP_FILE"
          echo "zipfile=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V0.17 project
        shell: bash
        run: |
          rm -rf v017-project
          mkdir -p v017-project
          unzip -q "${{ steps.findzip.outputs.zipfile }}" -d v017-project
          find v017-project -maxdepth 6 -type f | sort

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find v017-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: 找不到 settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android project：$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify V0.17 source nodes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          cat settings.gradle
          cat app/build.gradle
          MAIN="app/src/main/java/global/a009/aitts/MainActivity.java"
          grep -n "splitSubtitleSegments" "$MAIN"
          grep -n "writeSrtFile" "$MAIN"
          grep -n "formatSrtTime" "$MAIN"
          grep -n "encoder.flush" "$MAIN"
          grep -n "encoder.close" "$MAIN"
          grep -n "loadVoices" "$MAIN"
          grep -n "尚未偵測到台灣男聲" "$MAIN"
          grep -n "TW.*country\|country.*TW" "$MAIN" || true

      - name: Resolve dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            app:dependencies \
            --configuration debugRuntimeClasspath

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set +e
          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=========================================="
          echo "        V0.17 BUILD ERROR SUMMARY"
          echo "=========================================="
          grep -nEi -C 6 \
            'error:|cannot find symbol|does not exist|FAILURE:|What went wrong|Execution failed|Could not|Caused by:|A problem occurred|No matching variant|namespace|AAPT|Manifest merger failed|failed linking references|Could not resolve|Could not find' \
            "$GITHUB_WORKSPACE/build.log" | tail -n 300 || true
          echo "=========================================="
          echo "Gradle exit code: $BUILD_CODE"
          if [ "$BUILD_CODE" -eq 0 ]; then echo "APK 編譯成功"; else echo "APK 編譯失敗"; fi
          exit $BUILD_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V0.17-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Find generated APK
        id: apk
        if: success()
        shell: bash
        run: |
          APK_FILE=$(find v017-project -type f -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: 編譯完成但找不到 APK"
            find v017-project -type f -name "*.apk" -print
            exit 1
          fi
          mkdir -p apk-output
          cp "$APK_FILE" "apk-output/AI文字轉新音檔-V0.17-台灣聲音專用版.apk"

      - name: Upload V0.17 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI文字轉新音檔-V0.17-台灣聲音專用版-APK
          path: apk-output/AI文字轉新音檔-V0.17-台灣聲音專用版.apk
          if-no-files-found: error
          retention-days: 30
