name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find ZIP file
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 找不到 ZIP 檔案"
            exit 1
          fi

          echo "找到 ZIP：$ZIP_FILE"
          echo "zipfile=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android-project
          mkdir android-project

          unzip -q "${{ steps.findzip.outputs.zipfile }}" -d android-project

          echo "===== 解壓縮完成 ====="
          find android-project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          GRADLE_FILE=$(find android-project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: 找不到 settings.gradle 或 settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Android 專案位置：$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        shell: bash
        working-directory: ${{ steps
