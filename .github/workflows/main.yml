name: Build Android APK V0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find V0.13 ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*V0.13*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 找不到 V0.13 ZIP"
            find . -maxdepth 1 -type f -print
            exit 1
          fi

          echo "找到：$ZIP_FILE"
          echo "zipfile=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V0.13 project
        shell: bash
        run: |
          rm -rf v013-project
          mkdir -p v013-project
          unzip -q "${{ steps.findzip.outputs.zipfile }}" -d v013-project
          find v013-project -maxdepth 5 -type f | sort

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find v013-project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: 找不到 Android 專案"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android 專案：$PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show configuration
