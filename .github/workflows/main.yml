name: Build Android APK V0.18

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find V0.18 ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE="./AI文字轉新音檔-V0.18-免費台灣20聲線模式.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: 找不到指定的 V0.18 ZIP"
            echo "預期檔名：$ZIP_FILE"
            echo ""
            echo "目前 Repository 最外層檔案："
            find . -maxdepth 1 -type f -print
            exit 1
          fi

          echo "找到 ZIP：$ZIP_FILE"
          echo "zipfile=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V0.18 project
        shell: bash
        run: |
          rm -rf v018-project
          mkdir -p v018-project

          unzip -q "${{ steps.findzip.outputs.zipfile }}" -d v018-project

          echo "解壓完成"
          find v018-project -maxdepth 6 -type f | sort

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find v018-project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: 找不到 settings.gradle"
            find v018-project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project：$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "========== JAVA =========="
          java -version

          echo "========== GRADLE =========="
          gradle --version

          echo "========== SETTINGS =========="
          cat settings.gradle

          echo "========== APP BUILD.GRADLE =========="
          cat app/build.gradle

          echo "========== MAINACTIVITY CHECK =========="

          MAIN="app/src/main/java/global/a009/aitts/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: 找不到 MainActivity.java"
            exit 1
          fi

          grep -n "V0.18" "$MAIN" || true
          grep -n "男聲 01" "$MAIN" || true
          grep -n "男聲 10" "$MAIN" || true
          grep -n "女聲 01" "$MAIN" || true
          grep -n "女聲 10" "$MAIN" || true
          grep -n "cmn-tw-x-ctd" "$MAIN" || true
          grep -n "cmn-tw-x-cte" "$MAIN" || true
          grep -n "cmn-tw-x-ctc" "$MAIN" || true
          grep -n "zh-tw-language" "$MAIN" || true
          grep -n "writeSrtFile" "$MAIN" || true
          grep -n "formatSrtTime" "$MAIN" || true
          grep -n "encoder.flush" "$MAIN" || true
          grep -n "encoder.close" "$MAIN" || true

      - name: Resolve dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            app:dependencies \
            --configuration debugRuntimeClasspath

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set +e

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "          V0.18 BUILD RESULT"
          echo "=========================================="
          echo "Gradle exit code: $BUILD_CODE"
          echo ""

          if [ "$BUILD_CODE" -ne 0 ]; then
            echo "========== ERROR SUMMARY =========="

            grep -nEi -C 8 \
              'error:|cannot find symbol|does not exist|FAILURE:|What went wrong|Execution failed|Could not|Caused by:|A problem occurred|No matching variant|namespace|AAPT|Manifest merger failed|failed linking references|Could not resolve|Could not find|Compilation failed' \
              "$GITHUB_WORKSPACE/build.log" \
              | tail -n 400 || true

            echo ""
            echo "❌ APK 編譯失敗"
          else
            echo "✅ APK 編譯成功"
          fi

          exit $BUILD_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V0.18-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Find generated APK
        id: apk
        if: success()
        shell: bash
        run: |
          APK_FILE=$(find v018-project \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: 編譯完成但找不到 APK"
            find v018-project -type f -name "*.apk" -print
            exit 1
          fi

          echo "找到 APK：$APK_FILE"

          mkdir -p apk-output

          cp "$APK_FILE" \
            "apk-output/AI文字轉新音檔-V0.18-免費台灣20聲線模式.apk"

      - name: Upload V0.18 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI文字轉新音檔-V0.18-免費台灣20聲線模式-APK
          path: apk-output/AI文字轉新音檔-V0.18-免費台灣20聲線模式.apk
          if-no-files-found: error
          retention-days: 30
